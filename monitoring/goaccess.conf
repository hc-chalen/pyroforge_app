# ---------------------------------------------------------------------------
# GoAccess config for the PyroForge gateway's JSON usage log.
#
# Covers traffic shape: requests over time, busiest endpoints, response codes,
# slow requests, browsers. GoAccess has no per-account panel — for that use
# monitoring/usage_report.py, which reads the same log.
#
# The log is produced by the `pyro_usage` log_format in auth/gateway.conf; if
# you change the fields there, change the mapping here to match.
# ---------------------------------------------------------------------------

# Reads the dedicated "date"/"time" fields rather than "ts": GoAccess uses
# strptime(), and the musl one in this image cannot parse the "+00:00" offset
# that $time_iso8601 carries. gateway.conf emits all three for that reason.
date-format %Y-%m-%d
time-format %H:%M:%S
log-format {"ts":"%^","date":"%d","time":"%t","user":"%^","ip":"%h","method":"%m","path":"%U","status":"%s","bytes":"%b","req_time":"%T","upstream_time":"%^","ua":"%u"}

# Treat the gateway's own login/verify traffic as static noise so the endpoint
# panel reflects actual app usage.
ignore-panel REFERRERS
ignore-panel KEYPHRASES

# Resolve nothing over the network: the server may have no outbound DNS, and
# these are private tailnet/LAN addresses anyway.
with-mouse false
real-os true
