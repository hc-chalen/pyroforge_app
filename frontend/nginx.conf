# SPA server for the production PyroForge frontend bundle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large sequence payloads.
    client_max_body_size 25m;

    # --- Reverse-proxy the backend so the browser only ever talks to this one
    # origin (no CORS, no mixed content, backend need not be publicly exposed).
    # `backend` resolves to the backend service on the Docker Compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
