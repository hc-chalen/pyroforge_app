# SPA server for the production PyroForge frontend bundle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
