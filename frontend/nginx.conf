# SPA server for the production PyroForge frontend bundle.
#
# The app is unauthenticated, so this file is also the only thing standing
# between the open internet and a single-slot GPU worker. The rate limits below
# are sized for real interactive use, not for a script in a loop.

# --- Per-IP rate limit zones (http context; conf.d/* is included inside http) --
# Three buckets, because the endpoints have wildly different costs:
#
#   pyro_heavy — anything that queues or runs an ESM-2 forward pass. The Celery
#     pool is --concurrency=1, so an unthrottled client can queue hours of work
#     and lock everyone else out. A full manual run through the UI (predict →
#     optimize → fold → heatmap → embed) is ~5 requests, hence burst=5 nodelay.
#   pyro_jobs — job-status polling only. jobs.ts polls every 2s and a user can
#     have several jobs in flight, so this must be generous or the UI breaks.
#   pyro_api — everything else (cheap reads).
limit_req_zone $binary_remote_addr zone=pyro_heavy:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pyro_jobs:1m  rate=180r/m;
limit_req_zone $binary_remote_addr zone=pyro_api:1m   rate=60r/m;
limit_conn_zone $binary_remote_addr zone=pyro_conn:1m;

# 429 rather than the 503 default: this is client throttling, not an outage.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The largest legitimate request is a 1000-residue sequence (~1 KB). Anything
    # near this ceiling is already abuse; 25m only bought the sender a free upload.
    client_max_body_size 1m;

    # Ten concurrent requests is far past what the UI opens, and it stops a single
    # client from parking connections on the long-running proxy timeout.
    limit_conn pyro_conn 10;

    # Inherited by every location below, so each one only needs its own
    # proxy_pass and limit_req.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    # Retraining is an admin operation: it monopolises the GPU for as long as it
    # runs, and the app never calls it. Blocked here rather than removed from the
    # backend so it stays available on the server itself, against the loopback
    # backend:  curl -X POST 127.0.0.1:8000/api/v1/admin/train
    # An exact-match location wins over both the regex and the prefix below.
    location = /api/v1/admin/train {
        return 403;
    }

    # Job polling. Listed before the heavy regex because nginx takes the first
    # matching regex location, and /jobs/ must not land in the strict bucket.
    location ~ ^/api/v1/jobs/ {
        limit_req zone=pyro_jobs burst=60 nodelay;
        proxy_pass http://backend:8000;
    }

    # GPU work: queued jobs and the synchronous endpoints that run ESM-2 inside
    # the API process (those bypass the Celery time limits entirely).
    # `procure/quote` belongs here too: it is synchronous, and with TWIST_API_KEY
    # set it blocks a FastAPI threadpool slot on a 30 s outbound call to Twist. At
    # the general 60/min it took only a handful of clients to park every slot and
    # take the whole API — including /health — down with it.
    location ~ ^/api/v1/(optimize|predict|predict/job|visualize/fold|visualize/heatmap|embed/compare|registry/search|procure/quote)$ {
        limit_req zone=pyro_heavy burst=5 nodelay;
        proxy_pass http://backend:8000;
    }

    # --- Reverse-proxy the backend so the browser only ever talks to this one
    # origin (no CORS, no mixed content, backend need not be publicly exposed).
    # `backend` resolves to the backend service on the Docker Compose network.
    location /api/ {
        limit_req zone=pyro_api burst=20 nodelay;
        proxy_pass http://backend:8000;
    }
    location = /health {
        limit_req zone=pyro_api burst=20 nodelay;
        proxy_pass http://backend:8000/health;
    }

    # Single-page app: unknown routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
