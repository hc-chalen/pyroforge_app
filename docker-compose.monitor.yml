# ---------------------------------------------------------------------------
# PyroForge usage monitoring (TEMPORARY, pairs with docker-compose.auth.yml).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  -f docker-compose.auth.yml -f docker-compose.monitor.yml up -d
#
# Three views, deliberately none of them public — reach them over an SSH tunnel:
#
#   ssh -L 7890:localhost:7890 -L 5555:localhost:5555 you@gpu-server
#     http://localhost:7890  traffic report  (GoAccess)
#     http://localhost:5555  job durations   (Flower / Celery)
#   plus, on the server:
#     python3 monitoring/usage_report.py     per-account usage
#
# Requires the auth gateway, which is what writes ./logs/usage.log.
# ---------------------------------------------------------------------------
services:
  # Regenerates a static HTML traffic report every minute. Static rather than
  # GoAccess's --real-time-html because that needs a websocket, which is awkward
  # and fragile through an SSH tunnel.
  goaccess:
    image: allinurl/goaccess:1.9.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -s /var/log/pyroforge/usage.log ]; then
            goaccess /var/log/pyroforge/usage.log \
              --config-file=/etc/goaccess/goaccess.conf \
              --no-progress -o /report/index.html 2>/dev/null || true
          fi
          sleep 60
        done
    volumes:
      - ./logs:/var/log/pyroforge:ro
      - ./monitoring/goaccess.conf:/etc/goaccess/goaccess.conf:ro
      - usage-report:/report
    restart: unless-stopped

  # Serves the generated report. Loopback only — it contains usage data and has
  # no auth of its own.
  usage-report:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:7890:80"
    volumes:
      - usage-report:/usr/share/nginx/html:ro
    depends_on:
      - goaccess
    restart: unless-stopped

  # Celery task monitor: how long optimisation/folding jobs actually take, which
  # ones fail, and whether the worker is keeping up. Loopback only.
  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5555 --url_prefix=
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  usage-report:
