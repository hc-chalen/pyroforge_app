# ---------------------------------------------------------------------------
# PyroForge access gate — login overlay (TEMPORARY, for the trial deployment).
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  -f docker-compose.auth.yml up -d
#
# Puts an authenticating nginx gateway on host port 3002, in front of the
# frontend container (which the base file keeps on loopback :3001). Nothing in
# backend/app/** or frontend/src/** is aware of any of this.
#
# Requires, before first start:
#   cp auth/users.example.yml auth/users.yml     # then add real accounts
#   echo "AUTH_SECRET_KEY=$(openssl rand -base64 32)" >> .env
#
# To remove the login layer permanently, see docs/OPERATIONS.md.
# ---------------------------------------------------------------------------
services:
  auth-service:
    build: ./auth
    environment:
      # No default on purpose: booting without a persistent secret would silently
      # log everyone out on every restart.
      AUTH_SECRET_KEY: "${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env, generate one with openssl rand -base64 32}"
      AUTH_USERS_FILE: /app/users.yml
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-14}
      # Set true once the deployment is behind HTTPS (see docs/OPERATIONS.md).
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      # Read-only, and re-read per login — add a user by editing this file, no
      # restart and no dropped sessions.
      - ./auth/users.yml:/app/users.yml:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth-gateway:
    image: nginx:1.27-alpine
    # The only publicly reachable port of the whole stack.
    ports:
      - "3002:80"
    volumes:
      - ./auth/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # Per-user usage log, read by monitoring/usage_report.py on the host.
      - ./logs:/var/log/pyroforge
    depends_on:
      auth-service:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
