<!doctype html>
<!--
  PyroForge access gate — login page.
  Standalone by design: no build step, no assets, no dependency on the frontend
  bundle, so it can be deleted with the rest of auth/ in one go. Colours are
  copied from frontend/src/theme.ts rather than imported.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sign in · PyroForge</title>
    <style>
      :root {
        --brand: #2c5985;
        --brand-hover: #254b70;
        --bg: #f4f6f8;
        --card: #ffffff;
        --border: #dde3e9;
        --text: #1e3d5b;
        --muted: #657283;
        --error: #b03a3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --brand: #6fa3d8;
          --brand-hover: #96c0e4;
          --bg: #0f1318;
          --card: #1d242c;
          --border: #2a323c;
          --text: #e7eaed;
          --muted: #8f9aa5;
          --error: #e88;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 0 0 1.5rem;
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.4;
      }
      label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 600;
        margin-bottom: 0.375rem;
      }
      input {
        width: 100%;
        padding: 0.625rem 0.75rem;
        margin-bottom: 1rem;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo,
          monospace;
        font-size: 0.9375rem;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      input:focus {
        outline: 2px solid var(--brand);
        outline-offset: -1px;
      }
      button {
        width: 100%;
        padding: 0.6875rem;
        font-size: 0.9375rem;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: var(--brand-hover); }
      @media (prefers-color-scheme: dark) {
        button { color: #0f1318; }
      }
      .error {
        min-height: 1.25rem;
        margin: 0 0 0.5rem;
        color: var(--error);
        font-size: 0.8125rem;
      }
      .foot {
        margin: 1.5rem 0 0;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>PyroForge</h1>
      <p class="sub">Protein heat-stability engineering. Sign in to continue.</p>
      {{ERROR}}
      <form method="post" action="/_auth/login" autocomplete="on">
        <input type="hidden" name="next" value="{{NEXT}}" />
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
          autofocus
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Sign in</button>
      </form>
      <p class="foot">
        Access is limited to accounts issued for this trial deployment. Your
        saved analyses live in this browser only and are not shared between
        accounts.
      </p>
    </main>
  </body>
</html>
