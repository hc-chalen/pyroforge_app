# ---------------------------------------------------------------------------
# PyroForge access gate — nginx front door.
#
# Sits in front of the existing frontend container and gates every request on a
# session cookie, via an auth_request subrequest to auth-service. The app's own
# nginx (frontend/nginx.conf) is untouched and still owns the /api/ → backend
# proxying; this file only decides who gets through.
#
#   :3002 → auth-gateway → frontend:80 → backend:8000
#
# It is also where per-user usage logging happens: the authenticated username
# comes back from auth-service on the subrequest and is written to
# /var/log/pyroforge/usage.log for monitoring/usage_report.py.
#
# Delete with the rest of auth/ — see docs/OPERATIONS.md.
# ---------------------------------------------------------------------------

# Brute-force brake on the login form. 12 requests/minute per IP, allowing a
# short burst for someone genuinely fat-fingering their password.
limit_req_zone $binary_remote_addr zone=pyro_login:1m rate=12r/m;

# GoAccess parses dates with strptime(), and musl's strptime cannot read the
# "+00:00" offset in $time_iso8601. Split the timestamp into plain date and time
# fields it can consume; the full "ts" stays for monitoring/usage_report.py.
map $time_iso8601 $log_date {
    "~^(?<ymd>\d{4}-\d{2}-\d{2})"  $ymd;
    default                        "-";
}
map $time_iso8601 $log_time {
    "~T(?<hms>\d{2}:\d{2}:\d{2})"  $hms;
    default                        "-";
}

# One JSON object per request. escape=json keeps user agents and paths from
# breaking the format. `user` is empty for unauthenticated requests.
log_format pyro_usage escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"date":"$log_date",'
    '"time":"$log_time",'
    '"user":"$auth_user",'
    '"ip":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"req_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"ua":"$http_user_agent"'
    '}';

server {
    listen 80;
    server_name _;

    # Issue relative Location headers. nginx would otherwise rewrite
    # "/_auth/login" into an absolute URL built from $host and the *listen*
    # port (80 in-container) — so a browser on http://host:3002/ would be
    # redirected to http://host/_auth/login and never reach the login page.
    absolute_redirect off;

    # Match the app's limit so large sequence payloads are not cut off here.
    client_max_body_size 25m;

    # Structured log for the usage reports, plus the usual stdout line so
    # `docker compose logs auth-gateway` stays useful.
    access_log /var/log/pyroforge/usage.log pyro_usage;
    access_log /var/log/nginx/access.log main;

    # --- Auth endpoints: NOT gated (they are how you get through the gate) ----
    location = /_auth/login {
        limit_req zone=pyro_login burst=5 nodelay;
        proxy_pass http://auth-service:9000/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /_auth/logout {
        proxy_pass http://auth-service:9000/logout;
        proxy_set_header Host $host;
    }

    # The auth_request target. `internal` means browsers cannot call it directly.
    location = /_auth/verify {
        internal;
        proxy_pass http://auth-service:9000/verify;
        # A subrequest only needs the cookies, never the body.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Hard block: kicks off a full model retrain and would monopolise the
    # GPU. No trial user needs it; run it on the server via the loopback backend
    # port instead (curl 127.0.0.1:8000/api/v1/admin/train).
    location = /api/v1/admin/train {
        return 403 '{"detail":"Disabled on this deployment."}';
        default_type application/json;
    }

    # --- API: gated, and fails as JSON so the SPA sees a sane error -----------
    location /api/ {
        auth_request /_auth/verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        # NOT wrapped in `if`: `if` runs in the rewrite phase, before auth_request
        # runs in the access phase, so it would always see an empty value.
        # add_header resolves its argument in the header-filter phase (after the
        # subrequest) and skips the header entirely when the value is empty.
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @api_unauthorised;

        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Must be at least as long as the app's own 300s, or the gateway would
        # time out first on long optimisation jobs.
        proxy_read_timeout 300s;
    }

    location = /health {
        auth_request /_auth/verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        error_page 401 = @api_unauthorised;
        proxy_pass http://frontend:80/health;
        proxy_set_header Host $host;
    }

    # --- Everything else: the SPA. Gated, redirecting to the login page -------
    location / {
        auth_request /_auth/verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        # Sliding-expiry renewal issued by /verify; nginx drops the subrequest's
        # headers unless they are copied across explicitly. See the note in the
        # /api/ block above for why this must not be wrapped in `if`.
        add_header Set-Cookie $auth_cookie;
        error_page 401 = @login_redirect;

        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login_redirect {
        # $uri (path only, no query string) — the SPA keeps its state client
        # side, and it avoids having to URL-encode a query string into `next`.
        return 302 /_auth/login?next=$uri;
    }

    location @api_unauthorised {
        default_type application/json;
        return 401 '{"detail":"Not authenticated. Reload the page to sign in."}';
    }
}
