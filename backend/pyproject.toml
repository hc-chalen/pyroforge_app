[project]
name = "pyroforge-backend"
version = "0.1.0"
description = "PyroForge bio-computation backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "torch>=2.2.0",
    "fair-esm>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "biopython>=1.83",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "matplotlib>=3.8.0",
    "pandas>=2.0.0",
]

# ---------------------------------------------------------------------------
# torch wheel selection.
#
# PyPI's default torch wheel is the CUDA build: it drags in ~2.7 GB of nvidia-*
# wheels on every platform, including Apple Silicon and any CPU-only Linux host
# that can never use them. That made `uv sync` in the Docker build download
# multi-hundred-MB CUDA wheels and time out.
#
# So: pull torch from the CPU index everywhere except Linux/x86_64, which is the
# only platform the GPU stack (docker-compose.gpu.yml, DEVICE=cuda) targets.
# A Linux/aarch64 GPU host (Jetson, GH200) would get the CPU build here — add a
# marker for it if that ever becomes a deployment target.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[project.scripts]
# Served-model training pipeline (run in this order for a full rebuild)
pyroforge-train = "app.training.train:main"                       # model_thermo (dG-only ensemble)
pyroforge-train-ddg = "app.training.train_ddg:main"               # model_ddg (served ΔΔG, antisymmetric)
pyroforge-ingest-meltome = "app.training.ingest_meltome:main"     # download + ESM2-embed Meltome Atlas
pyroforge-train-tm = "app.training.train_tm_meltome:main"         # model_tm (served absolute Tm)
pyroforge-automl-tm = "app.training.automl_tm:main"               # AutoML search → tune/promote model_tm
# Characterises the shipped model_ddg: fits the level calibration and measures the
# within-protein ranking quality the optimizer reports. Re-run after train-ddg.
pyroforge-calibrate-ddg = "app.training.calibrate_ddg:main"       # model_ddg calibration + ranking stats
# Builds the local iGEM parts snapshot the Registry search runs against. Without
# it the registry engine reports itself as not provisioned rather than answering
# queries against a stand-in database.
pyroforge-fetch-parts = "app.data.igem_parts:main"
# Offline NAS research tooling (feeds the /models/nas-report panel)
pyroforge-autopytorch = "app.training.autopytorch_tune:main"

# NOTE: offline evaluation/plotting scripts (evaluate_all_models,
# evaluate_and_visualize, autopytorch_visualize) are intentionally git-ignored
# (see backend/.gitignore) and therefore not exposed as console scripts here.
# Run them locally via `uv run python -m app.training.<module>` if needed.

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
