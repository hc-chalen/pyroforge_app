# ---------------------------------------------------------------------------
# PyroForge — base (production-oriented) stack.
#
#   docker compose up                    → dev stack (this file + the auto-merged
#                                           docker-compose.override.yml: hot reload,
#                                           Vite dev server, source bind-mounts)
#   docker compose -f docker-compose.yml up
#                                        → production stack (this file only: baked
#                                           images, no reload, nginx frontend)
#   DEVICE=cuda docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#                                        → production stack on an NVIDIA GPU
#
# Serving needs the trained checkpoints in ./backend/checkpoints and the ESM-2
# weights (downloaded once to ~/.cache/torch). The esm2_*.pt files are training
# data only.
# ---------------------------------------------------------------------------

# Everything the three Celery workers share. They differ only in which queue
# they consume and which pool they use, so the rest is defined once here and
# merged in with `<<:`. Compose ignores top-level `x-` keys.
x-worker-base: &worker-base
  build: ./backend
  environment:
    REDIS_URL: redis://redis:6379/0
    # Training data path. Serving never reads it — that needs only the
    # checkpoints — so the base stack mounts no dataset and this path is
    # expected to be absent. To retrain in Docker (POST /api/v1/admin/train)
    # add the training overlay, which mounts esm2_train.pt here:
    #   docker compose -f docker-compose.yml -f docker-compose.train.yml up
    DATA_PATH: ${DATA_PATH:-/data/esm2_train.pt}
    CHECKPOINT_DIR: /app/checkpoints
    DEVICE: ${DEVICE:-cpu}
    TORCH_HOME: /app/cache/torch
  depends_on:
    redis:
      condition: service_healthy
    backend:
      condition: service_healthy
  volumes:
    - ./backend/checkpoints:/app/checkpoints
    - pyroforge-cache:/app/cache
    - ${HOME}/.cache/torch:/app/cache/torch

services:
  redis:
    image: redis:7-alpine
    # NOT published on the host at all. Redis has no auth, and this is also the
    # Celery broker: anything that can reach it can push arbitrary task payloads
    # to the worker. Even 127.0.0.1 is too much on a shared machine, where every
    # other account on the box is "localhost". Containers reach it as
    # `redis:6379` over the compose network, which is unaffected.
    # To inspect it: docker compose exec redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    # NOT published on the host. The browser reaches the API through the frontend
    # nginx proxy, which is also where the rate limits and the /admin/train block
    # live — publishing 8000, even on 127.0.0.1, hands every local account on the
    # server an unthrottled way around all of it.
    # To debug: docker compose exec backend curl -s localhost:8000/health
    # To retrain: docker compose exec backend curl -X POST localhost:8000/api/v1/admin/train
    environment:
      REDIS_URL: redis://redis:6379/0
      # Training data path. Serving never reads it — that needs only the
      # checkpoints — so the base stack mounts no dataset and this path is
      # expected to be absent. To retrain in Docker (POST /api/v1/admin/train)
      # add the training overlay, which mounts esm2_train.pt here:
      #   docker compose -f docker-compose.yml -f docker-compose.train.yml up
      DATA_PATH: ${DATA_PATH:-/data/esm2_train.pt}
      CHECKPOINT_DIR: /app/checkpoints
      # CPU by default (correct on any host; required on Apple Silicon — ESM-2 is
      # degenerate on MPS). Set DEVICE=cuda on a GPU host, ideally with the
      # docker-compose.gpu.yml override that reserves the NVIDIA device.
      DEVICE: ${DEVICE:-cpu}
      TORCH_HOME: /app/cache/torch
      PRELOAD_ESM2_ON_STARTUP: "false"
      # Browser origins allowed to call the API. Defaults to localhost for dev;
      # on a remote host set CORS_ORIGINS in .env, e.g.
      #   CORS_ORIGINS=["http://100.65.250.65:3002"]
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/checkpoints:/app/checkpoints
      - pyroforge-cache:/app/cache
      # Reuse host ESM-2 weights so Docker does not re-download ~2.5 GB.
      - ${HOME}/.cache/torch:/app/cache/torch
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # First boot may download ESM-2 weights; don't mark unhealthy meanwhile.
      start_period: 60s

  # --- Celery workers -------------------------------------------------------
  # One worker per queue (routing table lives in app/core/celery_app.py). They
  # were a single worker until a ~150 s optimization was found to stall every
  # concurrent user's ~1 s prediction behind it — with a class using the app at
  # once, that reads as "the site is broken". Splitting the queues means a slow
  # job can only ever delay other slow jobs.
  #
  # Scaling: `docker compose up -d --scale worker-fast=2` adds capacity to one
  # class without touching the others. Each ESM-2 worker resides ~3.2 GB, so
  # check the Docker memory limit before scaling worker-fast/worker-heavy.
  worker-fast:
    <<: *worker-base
    # predict_sequence, registry_search — seconds each. Solo pool: ESM-2/PyTorch
    # is not fork-safe, and threads would contend on the same GIL-bound forward
    # pass anyway.
    command: >
      uv run celery -A app.core.celery_app worker
      --queues fast --hostname fast@%h
      --loglevel=info --pool=solo --concurrency=1

  worker-heavy:
    <<: *worker-base
    # optimize_sequence, train_models — minutes each, saturating every core
    # (~11 CPUs on the measured scan). A second slot here would only split the
    # same cores and slow both jobs, so this stays single-slot.
    command: >
      uv run celery -A app.core.celery_app worker
      --queues heavy --hostname heavy@%h
      --loglevel=info --pool=solo --concurrency=1

  worker-io:
    <<: *worker-base
    # fold_structure — blocked on the external ESMFold API, not on local compute,
    # and it never loads ESM-2 (the engine registry is lazy), so this container
    # stays light. Threads are safe here precisely because no torch model is
    # involved; 4 folds can wait on the network at once.
    #
    # Note: app.core.limits arms its SIGALRM soft-limit backstop only on the main
    # thread, so it stands down under this pool. Folding is bounded instead by
    # the httpx timeouts in VisualizationEngine (FOLD_READ_TIMEOUT_S).
    command: >
      uv run celery -A app.core.celery_app worker
      --queues io --hostname io@%h
      --loglevel=info --pool=threads --concurrency=4

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Empty → the bundle uses same-origin relative URLs, proxied by the
        # frontend nginx to the backend. No CORS, no mixed content, backend need
        # not be publicly exposed. Override only for a cross-origin setup.
        VITE_API_URL: ${VITE_API_URL:-}
    # Public entrypoint of the whole stack: the SPA, which also proxies /api/ to
    # the backend so the backend itself need not be exposed.
    ports:
      - "3002:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pyroforge-cache:
